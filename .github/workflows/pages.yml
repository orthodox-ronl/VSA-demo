# Deploy VSA-demo to GitHub Pages.
# - push main  → productie (gh-pages root)
# - andere branch → preview (gh-pages:/preview/)
# URL prod:    https://orthodox-ronl.github.io/VSA-demo/
# URL preview: https://orthodox-ronl.github.io/VSA-demo/preview/
# Pages setting: Deploy from a branch → gh-pages → /.
#
# Checks (blocking): sync, validate (--fail-on-warnings), build-markdown,
# musicxml, hugo, interne link/asset-check.
# Checks (niet-blocking): externe http(s)-links.

name: Deploy site to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    outputs:
      destination_dir: ${{ steps.target.outputs.destination_dir }}
      url_prefix: ${{ steps.target.outputs.url_prefix }}
      pages_url: ${{ steps.target.outputs.pages_url }}
      label: ${{ steps.target.outputs.label }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout bron repository
        uses: actions/checkout@v4
        with:
          repository: orthodox-ronl/bron
          path: vendor/bron
          ref: main

      - name: Checkout VSA-tooling
        uses: actions/checkout@v4
        with:
          repository: orthodox-ronl/VSA-tooling
          path: vendor/VSA-tooling
          ref: main

      - name: Determine deploy target
        id: target
        shell: bash
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "base_url=https://orthodox-ronl.github.io/VSA-demo/" >> "$GITHUB_OUTPUT"
            echo "destination_dir=" >> "$GITHUB_OUTPUT"
            echo "url_prefix=/VSA-demo/" >> "$GITHUB_OUTPUT"
            echo "pages_url=https://orthodox-ronl.github.io/VSA-demo/" >> "$GITHUB_OUTPUT"
            echo "label=production" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://orthodox-ronl.github.io/VSA-demo/preview/" >> "$GITHUB_OUTPUT"
            echo "destination_dir=preview" >> "$GITHUB_OUTPUT"
            echo "url_prefix=/VSA-demo/preview/" >> "$GITHUB_OUTPUT"
            echo "pages_url=https://orthodox-ronl.github.io/VSA-demo/preview/" >> "$GITHUB_OUTPUT"
            echo "label=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Show deploy target
        run: |
          echo "Target: ${{ steps.target.outputs.label }}"
          echo "base_url: ${{ steps.target.outputs.base_url }}"
          echo "destination_dir: '${{ steps.target.outputs.destination_dir }}'"
          echo "url_prefix: ${{ steps.target.outputs.url_prefix }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install catalogus + vsa-tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e vendor/bron
          python -m pip install -e "vendor/VSA-tooling[rendering]"

      - name: Install rendering fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Sync zondag bronbestanden
        run: python scripts/sync_bron_zondagen.py --bron-root vendor/bron

      - name: Validate VSA content
        run: python scripts/validate_content.py --summary --fail-on-warnings content-source

      - name: Generate Markdown + SVG
        run: |
          rm -rf generated/content static/vsa
          vsa build-markdown \
            content-source \
            generated/content \
            static/vsa \
            --output-mode shortcode

      - name: Generate MusicXML
        run: vsa musicxml content-source static/vsa/mxl

      - name: Update navigation placeholders
        run: python scripts/update-nav-placeholders.py generated/content

      - name: Inject git dates and build stamp
        run: |
          python scripts/inject_git_dates.py generated/content content-source
          python scripts/write_build_stamp.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"

      - name: Build Hugo site
        run: |
          hugo \
            --source . \
            --contentDir generated/content \
            --destination generated/site \
            --minify \
            --baseURL "${{ steps.target.outputs.base_url }}"

      - name: Check internal links and assets
        run: |
          python scripts/check_hugo_links_and_assets.py \
            --site-dir generated/site \
            --url-prefix "${{ steps.target.outputs.url_prefix }}"

      - name: Check external links (non-blocking)
        continue-on-error: true
        run: python scripts/check_external_links.py --site-dir generated/site

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: generated/site
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    uses: orthodox-ronl/VSA-tooling/.github/workflows/pages-deploy-reusable.yml@main
    with:
      artifact_name: pages-site
      publish_dir: site
      destination_dir: ${{ needs.build.outputs.destination_dir }}
      url_prefix: ${{ needs.build.outputs.url_prefix }}
      pages_url: ${{ needs.build.outputs.pages_url }}
      keep_files: true
    permissions:
      contents: write
