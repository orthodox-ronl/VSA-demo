<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>

<body>
  <header class="site-header">
    <div class="site-header-inner">
      {{ partial "site-nav.html" . }}
      {{ partial "site-jumps.html" . }}
    </div>
  </header>

  <main class="page">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
