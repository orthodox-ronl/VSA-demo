<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <link rel="icon" href="{{ "images/favicon.ico" | relURL }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ "images/favicon-16x16.png" | relURL }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "images/favicon-32x32.png" | relURL }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "images/apple-touch-icon.png" | relURL }}">
  <link rel="manifest" href="{{ "images/site.webmanifest" | relURL }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>

<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-header-start">
        <a class="site-logo" href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>
          <img src="{{ "images/favicon-32x32.png" | relURL }}" width="26" height="26" alt="">
          <span class="site-logo-text">{{ site.Title }}</span>
        </a>
        {{ partial "site-nav.html" . }}
      </div>
      {{ partial "site-jumps.html" . }}
    </div>
  </header>

  <main class="page">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
